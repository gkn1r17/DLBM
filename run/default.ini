;;;;;;;;;;;;;;;;;;;;;; SEMICOLON DENOTES COMMENT ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;random seed for simulation. -1 = generate from time
[Control]
SEED=-1

[TimeStepping]
;total duration in days (100 years)
DURATION_DAY=36000
;dispersal timestepping interval in hours (30 days)
DISP_HOURS=720.0
;growth and mortality timestepping interval in hours
GROWTH_HOURS=24.0
;if true simulation will finish when global diversity=1
STOP_AT_1=false


[Population]
;Initial size of each lineage
INIT_MODE=local_singletons
;carrying capacity of each location
K=100
;minimum viable population in continuous model
MIN_VIABLE_POP=0


[TransportMatrix]
;number of locations
NUM_BOXES=1972
;path to txt file where TM is held
TM_FILE = 30day_upper_50m_1972/annualmean/TM_30day_upper_50m_1972_annualmean.txt


[Ecological]
;maximum growth rate/number of births (mumax) per day
GROWTH_RATE_DAY=1.0
;mutation as a proportion of growth rate
MUTATION=0.0
;if true mortality is controlled by population size and growth is fixed, 
;else growth is controlled by population size and mortality is fixed
TOP_DOWN=true


[Dispersal]
;multiply each dispersal probability by this
DISP_SCALER=1

;Days between resets of transport eligibility (0 disables holding)
UNAVAILABLE_DAYS=0

[Selection]
;niche width
W=12.0
;path to temperature file
TEMP_FILE = 30day_upper_50m_1972/annualmean/TEMP_upper_50m_1972_annualmean.csv
;standard deviation of normally distributed mutations in thermal optimum
TEMP_MUT_SD=0.0


[Dormancy]
;equilibrium fraction of individuals in the dormant state
DORMANT_FRAC=0.0
;characteristic timescale in days for active/dormant switching
DORMANT_TAU_DAY=30.0

[Tracer]
;do not use for regular simulations: switch on for special simulations just to calculate t_min
TRACER_MODE=false


[Continuous]
;number of shared-memory worker threads used only by deterministic continuous mode
NUM_WORKERS=16

[Parallelization]
;csv file specifying how locations are divided into clusters and clusters into nodes
;two columns:
;column 1 = cluster indices (starting from 1) = parallelized within one computer
;column 2 = node indices (starting from 0) = parallelized across computers*/
CLUST_FILE=none


[InputOutput]
;path and prefix for output files; generated output should normally be written to ../output/
FILE_OUT=../output/dLBM
;threshold in seconds of no regular update  
;before posts update confirming hasn't frozen
TIME_THRESH=100
;KEEP FALSE: birth hour mechanism for saving now changed and will happen automatically
;if mutation > 0, rounded to REPORT_TIMESTEPS_DAY interval. 
;May reintroduce in future more precise tracking of birth hour so left this option in for now
SAVE_BIRTHHOUR=false
;times in days when to save all results as csv files.
;by default, outputs are saved at approx logarithmically spaced times and at DURATION_DAY.
;this can instead be set to a path to a csv file containing a single column of times,
;or to a comma-separated list of times added directly here, e.g. 0,30,360
SAVE_TIMESTEPS_DAY=visualisation
;as with SAVE_TIMESTEPS_DAY but for reporting i.e. when global and local diversities should be printed to standard out
;NOTE now also used to save birth times so suggest keep at 10 day intervals (timesteps10Days.csv) 
;to have 10 day granularity in lineage birth times
REPORT_TIMESTEPS_DAY=timesteps10Days.csv
;either "none" or if loading from previous run path to file loading from and prefix
FILE_LOAD=none
;if loading previous run , gives day and hour to load
;format=[day]h[hour](e.g. :360h8 for hour 8 on day 360)
;h0 can be omitted
LOAD_HOUR=0
;debug log: see test.TestJUnit 
DEBUG=false
;debug log for basic mutation: see test.TestJUnit 
DEBUG_MUTANTS=false
;debug log for printing whole phylogenies: see test.TestJUnit 
DEEP_DEBUG_MUTANTS=false
;interval in days at which checkpointing happens
CHECKPOINT_INTERVAL_DAY=360
;only used when saving phylogeny: timesteps after which mutations are saved / flushed. Suggest "timestepsYearly.csv" if saving phylogeny or use "none" if not saving phylogeny
MUTANT_TIMESTEPS_DAY=none 
